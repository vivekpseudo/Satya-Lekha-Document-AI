# Deploy file: runs a prebuilt image from your registry. Nothing is built on the server.
#
#   docker compose pull
#   docker compose up -d
#
# Needs only this file and a .env next to it (see .env.example). To build and push the image,
# see docker-compose.build.yml. Full guide: DEPLOYMENT.md.
name: satya-lekha

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env, for example registry.example.com/satya-lekha-app:1.0.0}
    restart: unless-stopped
    environment:
      EXTRACTOR: ${EXTRACTOR:-local}
      EMBEDDER: ${EMBEDDER:-local}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      DOCUMENT_AI_LOCATION: ${DOCUMENT_AI_LOCATION:-us}
      DOCUMENT_AI_PROCESSOR_ID: ${DOCUMENT_AI_PROCESSOR_ID:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://user:password@external_postgres:5432/db_name}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      # Loopback by default: a reverse proxy on the same host (or on the "proxy" network) is the way in.
      # Set APP_PORT_BIND=0.0.0.0:8000 only if the port must be public, or 127.0.0.1:18000 if 8000 is taken.
      - "${APP_PORT_BIND:-127.0.0.1:8000}:8000"
    command: >
      sh -c "python -m app.init_db &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - existing_postgres_network
      - proxy

networks:
  existing_postgres_network:
    external: true
    name: ${POSTGRES_NETWORK:-postgres_default}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
