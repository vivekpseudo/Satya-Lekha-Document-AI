services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: satya_lekha
      POSTGRES_USER: satya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-regulatory-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satya -d satya_lekha"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      DOCUMENT_AI_LOCATION: ${DOCUMENT_AI_LOCATION:-us}
      DOCUMENT_AI_PROCESSOR_ID: ${DOCUMENT_AI_PROCESSOR_ID}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DATABASE_URL: postgresql+psycopg://satya:${POSTGRES_PASSWORD:-change-me}@postgres:5432/satya_lekha
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_credentials
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google_credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m app.init_db &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose: ["80"]
    networks:
      - internal
      - proxy

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
