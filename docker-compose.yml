services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      DOCUMENT_AI_LOCATION: ${DOCUMENT_AI_LOCATION:-us}
      DOCUMENT_AI_PROCESSOR_ID: ${DOCUMENT_AI_PROCESSOR_ID}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://user:password@external_postgres:5432/db_name}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_credentials
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google_credentials:ro
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.init_db &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - existing_postgres_network
      - proxy

networks:
  existing_postgres_network:
    external: true
    name: ${POSTGRES_NETWORK:-postgres_default}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
